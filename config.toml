# RestaurantIQ — Streamlit theme configuration
#
# CRITICAL: st.dataframe() (GlideDataGrid) renders cell text and
# backgrounds onto a <canvas> using THIS theme, not page CSS.
# Without this file, Streamlit defaults to a LIGHT theme, which
# causes GlideDataGrid to draw dark text — invisible against the
# dark canvas background forced by assets/style.css.
#
# These values mirror the design tokens in assets/style.css
# (--bg, --bg3, --primary, --text).

[theme]
base = "dark"
primaryColor = "#7C3AED"
backgroundColor = "#070B14"
secondaryBackgroundColor = "#0D1424"
textColor = "#FFFFFF"
font = "sans serif"